<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen & Cafeteria Chores Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .form-content {
            padding: 30px;
        }
        
        .info-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        
        .input-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .chore-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        
        .chore-item:hover {
            background-color: #f8f9ff;
        }
        
        .chore-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            margin-top: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .chore-item label {
            cursor: pointer;
            flex: 1;
            line-height: 1.5;
            color: #333;
        }
        
        .chore-item input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #999;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        @media (max-width: 600px) {
            .info-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .form-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Kitchen & Cafeteria Chores</h1>
            <p>Complete your assigned tasks and check them off</p>
        </div>
        
        <div class="form-content">
            <div class="info-section">
                <div class="input-group">
                    <label for="studentName">Student Name *</label>
                    <input type="text" id="studentName" required placeholder="Enter student name">
                </div>
                <div class="input-group">
                    <label for="staffName">Staff Name *</label>
                    <input type="text" id="staffName" required placeholder="Enter staff name">
                </div>
            </div>
            
            <!-- CAFETERIA CHORES -->
            <div class="section">
                <div class="section-title">🧹 Cafeteria Chores</div>
                
                <div class="chore-item">
                    <input type="checkbox" id="surfaces">
                    <label for="surfaces">Surfaces - Wipe all surfaces, tables, blenders, toasters; empty cereal catcher & beverage overflow</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="largeFridge">
                    <label for="largeFridge">Large Fridge - Wipe doors/handles, organize, clean spills</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="miniFridge">
                    <label for="miniFridge">Mini-Fridge/Microwaves - Wipe inside & outside of microwave, wipe mini-fridge doors</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="cafSweep">
                    <label for="cafSweep">Sweep - Sweep cafeteria thoroughly (behind doors, under trashcans, corners, cabinets, seating, tables)</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="bathrooms">
                    <label for="bathrooms">Bathrooms - Wipe counters/sinks/mirror, check stalls, replace toilet paper, restock, empty trash</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="cafMop">
                    <label for="cafMop">Mop - Use clean mop head, scrub hard spots, place mops upright, empty bucket</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="cafTrash">
                    <label for="cafTrash">Trash - Take garbage to dumpster, break down boxes, replace liner</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="exteriors">
                    <label for="exteriors">Exteriors - Pick up trash/equipment outside, return furniture, empty front door trash, shovel/sweep if needed</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="butler">
                    <label for="butler">Butler - Make meals for absent students, retrieve dishes from dorm, deliver to kitchen</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="rags">
                    <label for="rags">Rags - Wash, dry, and fold rags after breakfast (with morning staff help)</label>
                </div>
            </div>
            
            <!-- KITCHEN CHORES -->
            <div class="section">
                <div class="section-title">👨‍🍳 Kitchen Chores</div>
                
                <div class="chore-item">
                    <input type="checkbox" id="dishes">
                    <label for="dishes">Dishes - Turn on dishwasher/turbo box, rinse & run dishes, clean drain/filter, drain water, wipe down</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="dry">
                    <label for="dry">Dry - Take out dishes, dry them, wipe counter, use squeegee, put away</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="potsPans">
                    <label for="potsPans">Pots & Pans - Spray, wash/scrub, rinse, sanitize; place on rack face down; clean/squeegee sinks</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="sanitize">
                    <label for="sanitize">Sanitize - Dip scrubbed items in sani solution, ensure soap is off, place on drying rack</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="kitchenSurfaces">
                    <label for="kitchenSurfaces">Surfaces - Wipe prep tables, carts, sinks, dishwasher front, serving areas with sanitizer</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="kitchenSweep">
                    <label for="kitchenSweep">Sweep - Sweep kitchen thoroughly (under tables, behind door, under trashcans, corners); move mats outside</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="stoves">
                    <label for="stoves">Stoves - (Dinner/weekends only) Clean shiny parts, fronts, and stovetop (not griddle)</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="hotBar">
                    <label for="hotBar">Hot Bar - Turn off/drain, store leftovers (dated), wipe condiments, scrub with steel wool, wipe front</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="saladBar">
                    <label for="saladBar">Salad Bar - Remove utensils, cover with lids, wipe all surfaces</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="walls">
                    <label for="walls">Walls - Check all walls/doors in kitchen & cafeteria for cleanliness</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="kitchenMop">
                    <label for="kitchenMop">Mop - Use clean mop head, scrub hard spots, place mops upright, empty bucket, bring mats inside</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="kitchenTrash">
                    <label for="kitchenTrash">Trash - Take garbage to dumpster, break down boxes, replace liner</label>
                </div>
            </div>
            
            <!-- ADDITIONAL DINNER CHORES -->
            <div class="section">
                <div class="section-title">🌙 Additional Dinner Chores</div>
                
                <div class="chore-item">
                    <input type="checkbox" id="hallway">
                    <label for="hallway">Hallway - Remove items from benches/tables, clear clutter, take garbage to dumpsters</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="library">
                    <label for="library">Library - Take out trash, tidy furniture, clean surfaces, declutter, vacuum if needed</label>
                </div>
                
                <div class="chore-item">
                    <input type="checkbox" id="vacuum">
                    <label for="vacuum">Vacuum - Pick up items, remove personal items, vacuum both foyer rugs</label>
                </div>
            </div>
            
            <button class="submit-btn" onclick="submitForm()">✅ Submit Checklist</button>
        </div>
    </div>
    
    <script>
        // CONFIGURE YOUR WEBHOOK URL HERE
        const WEBHOOK_URL = 'https://engine.rewst.io/webhooks/custom/trigger/019be1ff-155a-7c00-ae39-1dd71708726e/24bb7605-f6ef-4806-a56f-bdf4e0fd45e5';
        
        async function submitForm() {
            const studentName = document.getElementById('studentName').value.trim();
            const staffName = document.getElementById('staffName').value.trim();
            
            if (!studentName || !staffName) {
                alert('Please enter both student name and staff name.');
                return;
            }
            
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const totalChores = checkboxes.length;
            const completedChores = Array.from(checkboxes).filter(cb => cb.checked).length;
            
            const completedTasks = [];
            const incompleteTasks = [];
            
            checkboxes.forEach(cb => {
                const label = document.querySelector(`label[for="${cb.id}"]`).textContent;
                if (cb.checked) {
                    completedTasks.push(label);
                } else {
                    incompleteTasks.push(label);
                }
            });
            
            // Prepare the data to send to webhook
            const submissionData = {
                timestamp: new Date().toISOString(),
                studentName: studentName,
                staffName: staffName,
                summary: {
                    totalChores: totalChores,
                    completedChores: completedChores,
                    completionPercentage: Math.round((completedChores / totalChores) * 100)
                },
                completedTasks: completedTasks,
                incompleteTasks: incompleteTasks
            };
            
            // Disable submit button while processing
            const submitBtn = document.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '⏳ Submitting...';
            submitBtn.disabled = true;
            
            try {
                // Send data to webhook
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(submissionData)
                });
                
                if (response.ok) {
                    // Success message
                    let message = `✅ Checklist Submitted Successfully!\n\n`;
                    message += `Student: ${studentName}\n`;
                    message += `Staff: ${staffName}\n`;
                    message += `Completed: ${completedChores}/${totalChores} tasks (${submissionData.summary.completionPercentage}%)\n`;
                    
                    alert(message);
                    
                    // Optional: Reset form after successful submission
                    // document.getElementById('studentName').value = '';
                    // document.getElementById('staffName').value = '';
                    // checkboxes.forEach(cb => cb.checked = false);
                } else {
                    throw new Error(`Server responded with status: ${response.status}`);
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('❌ Error submitting checklist. Please try again or contact support.\n\nError: ' + error.message);
            } finally {
                // Re-enable submit button
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
